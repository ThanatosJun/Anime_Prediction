# Reference baseline runner config.
#
# These experiments are external comparison points for the paper baseline
# matrix. They intentionally live outside src/fussion_branch so RQ ablations and
# literature baselines do not get mixed together.

data:
  meta_dir: data/fussion/post2000
  image_dir: data/image
  raw_anilist_path: data/raw/anilist_anime_data_complete.csv
  text_emb_dir: src/fussion_branch/embedding/text
  gpt2_text_emb_dir: .exp/baseline/text_features/gpt2
  c1_character_emb_dir: .exp/baseline/c1_character_features
  c1_character_image_dir: .exp/baseline/c1_character_images
  image_emb_dir: src/fussion_branch/embedding/image
  resnet50_image_emb_dir: .exp/baseline/image_features/resnet50
  rag_features_root: .exp/baseline/rag_features
  skapp_full_dataset_dir: .exp/baseline/skapp_full/dataset
  splits: ["train", "val", "test"]
  id_col: id

output:
  results_dir: .exp/baseline/results
  run_id: "01"
  notes: "Foundation baselines plus Armenta-style fusion scaffold"

targets:
  popularity:
    log_transform: true
  meanScore:
    log_transform: false

features:
  metadata:
    numeric:
      - release_year
      - episodes
      - duration
      - startDate_day
      - prequel_count
      - prequel_meanScore_mean
    log_numeric:
      - prequel_popularity_mean
    cyclic:
      release_quarter: 4
      startDate_month: 12
    categorical:
      - format
      - source
      - countryOfOrigin
    boolean:
      - isAdult
      - is_sequel
      - has_sequel
    multihot:
      genres:
        parser: literal_list
        top_k: null
      studios:
        parser: anilist_studios_json
        top_k: 50
      voice_actor_names:
        parser: pipe
        top_k: 50
  text_embedding:
    file_template: text_embeddings_{split}.parquet
    prefix: emb_
  text_embedding_gpt2:
    file_template: gpt2_text_embeddings_{split}.parquet
    prefix: gpt2_
    feature_name_prefix: gpt2_text
  character_embedding_armenta:
    file_template: c1_character_features_{split}.parquet
    prefix: char_
    feature_name_prefix: c1_character
  image_embedding:
    file_template: image_embeddings_{split}.parquet
  image_embedding_resnet50:
    file_template: resnet50_image_embeddings_{split}.parquet
    prefix: resnet_
    feature_name_prefix: resnet50_image
  rag:
    numeric:
      - rag_popularity
      - rag_score
      - rag_release_year
      - rag_episodes
      - rag_similarity_mean
      - rag_similarity_max
      - rag_topk_count
    boolean:
      - rag_found
    categorical:
      - rag_format
    multihot:
      rag_genres:
        parser: json_list
        top_k: null
      rag_studios:
        parser: json_list
        top_k: 50
  rag_skapp_proxy:
    numeric:
      - rag_popularity
      - rag_score
      - rag_release_year
      - rag_episodes
      - rag_similarity_mean
      - rag_similarity_max
      - rag_topk_count
      - skapp_contribution_mean
      - skapp_contribution_max
      - skapp_contribution_std
      - skapp_attention_entropy
      - skapp_selected_count
      - skapp_weighted_popularity
      - skapp_weighted_score
      - skapp_weighted_release_year
      - skapp_weighted_episodes
    boolean:
      - rag_found
    categorical:
      - rag_format
    multihot:
      rag_genres:
        parser: json_list
        top_k: null
      rag_studios:
        parser: json_list
        top_k: 50
  rag_skapp_graph_proxy:
    numeric:
      - rag_popularity
      - rag_score
      - rag_release_year
      - rag_episodes
      - rag_similarity_mean
      - rag_similarity_max
      - rag_topk_count
      - skapp_contribution_mean
      - skapp_contribution_max
      - skapp_contribution_std
      - skapp_attention_entropy
      - skapp_selected_count
      - skapp_weighted_popularity
      - skapp_weighted_score
      - skapp_weighted_release_year
      - skapp_weighted_episodes
    raw_numeric_prefixes:
      - skapp_graph_mask_
      - skapp_graph_rrcp_
      - skapp_graph_label_pop_
      - skapp_graph_label_score_
      - skapp_graph_text_
      - skapp_graph_image_

