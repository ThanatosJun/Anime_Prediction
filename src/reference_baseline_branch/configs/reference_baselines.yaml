baselines:
  - id: F0-Mean
    enabled: true
    feature_set: none
    model: mean
    reference: common baseline
    reproduction_level: common
    paper_supported_component: "Common lowest-reference predictor; no specific paper reproduction claimed."
    project_adaptation_component: "Predict train-set target mean for every validation/test sample."
    claim_allowed: "Used as a lowest-reference baseline."
    claim_not_allowed: "Do not cite this as reproducing any paper."

  - id: F0-Ridge-Meta
    enabled: true
    feature_set: metadata
    model: ridge
    params:
      alpha: 1.0
    reference: common baseline
    reproduction_level: common
    paper_supported_component: "Common linear baseline; no specific paper reproduction claimed."
    project_adaptation_component: "Ridge regression on AniList pre-release metadata using project temporal split."
    claim_allowed: "Used as a simple linear metadata baseline."
    claim_not_allowed: "Do not cite this as reproducing Lo & Syu 2023 or another paper."

  - id: F1-RF-Meta
    enabled: true
    feature_set: metadata
    model: random_forest
    params:
      n_estimators: 300
      max_depth: null
      min_samples_leaf: 2
      random_state: 42
      # Keep single-worker by default: some Windows sandbox sessions deny
      # joblib worker pipe creation.
      n_jobs: 1
    reference: Lo & Syu 2023
    reproduction_level: adapted
    paper_supported_component: "Lo & Syu 2023 supports pre-broadcast entertainment metadata with classical ML and includes Random Forest."
    project_adaptation_component: "Anime-domain regression on popularity/meanScore with AniList pre-release metadata and temporal split."
    claim_allowed: "Metadata-only Random Forest baseline adapted from Lo & Syu 2023."
    claim_not_allowed: "Do not claim exact reproduction; the original task is Japanese TV drama high/low rating classification with cross-validation."

  - id: F1-GB-Meta
    enabled: true
    feature_set: metadata
    model: gradient_boosting
    params:
      n_estimators: 300
      max_depth: 3
      learning_rate: 0.05
      random_state: 42
    reference: Lo & Syu 2023 + gradient boosting adaptation
    reproduction_level: adapted
    paper_supported_component: "Lo & Syu 2023 supports the metadata-only classical ML route, but not Gradient Boosting specifically."
    project_adaptation_component: "Stronger sklearn Gradient Boosting tabular baseline on the same AniList metadata feature set."
    claim_allowed: "Gradient-boosting extension of the Lo & Syu 2023 metadata-only classical ML route."
    claim_not_allowed: "Do not claim this model appears in Lo & Syu 2023."

  - id: F2-XGB-Concat
    enabled: true
    feature_set: metadata_text_image
    model: xgboost
    params:
      n_estimators: 500
      max_depth: 4
      learning_rate: 0.03
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      objective: reg:squarederror
    reference: Chen et al. 2019; Jeong et al. 2024
    reproduction_level: adapted
    paper_supported_component: "Chen et al. 2019 and Jeong et al. 2024 support visual/textual feature fusion with XGBoost-style classical regressors."
    project_adaptation_component: "AniList metadata + project text embeddings + project image embeddings concatenated for XGBoost regression."
    claim_allowed: "Feature-concat XGBoost baseline adapted from visual-textual popularity prediction literature."
    claim_not_allowed: "Do not claim same dataset, encoders, or exact feature extraction as the cited papers."

  - id: T2-XGB-TextEmb
    enabled: true
    feature_set: text_embedding
    model: xgboost
    params:
      n_estimators: 500
      max_depth: 4
      learning_rate: 0.03
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      objective: reg:squarederror
    reference: Anime synopsis traditional classifiers + text embedding adaptation
    reproduction_level: adapted
    paper_supported_component: "Anime synopsis-only success prediction literature supports single-modality text baselines for anime-related prediction."
    project_adaptation_component: "Project text embeddings are used as pre-release synopsis/title representations and fed to XGBoost regression."
    claim_allowed: "Text-embedding-only baseline adapted from anime synopsis-only prediction literature."
    claim_not_allowed: "Do not claim exact reproduction of TF-IDF/classifier synopsis methods because this baseline uses project embeddings and regression targets."

  - id: I1-XGB-ImageEmb
    enabled: true
    feature_set: image_embedding
    model: xgboost
    params:
      n_estimators: 500
      max_depth: 4
      learning_rate: 0.03
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      objective: reg:squarederror
    reference: Zhou, Zhang & Yi 2019
    reproduction_level: adapted
    paper_supported_component: "Poster/cover CNN feature literature supports using visual embeddings as predictive signals for entertainment performance."
    project_adaptation_component: "Project image embeddings from anime cover/banner assets are fed to XGBoost regression."
    claim_allowed: "Image-embedding-only baseline adapted from poster/cover visual-feature prediction literature."
    claim_not_allowed: "Do not claim exact reproduction of the poster CNN architecture or movie box-office setting."

  - id: C1-Armenta-MLP
    enabled: false
    feature_set: metadata_text_image
    model: mlp
    params:
      hidden_layer_sizes: [512, 256, 128]
      alpha: 0.001
      learning_rate_init: 0.0005
      max_iter: 300
      early_stopping: true
      random_state: 42
    reference: Armenta-Segura & Sidorov 2025
    reproduction_level: adapted
    paper_supported_component: "Armenta-Segura & Sidorov 2025 supports anime-domain multimodal prediction with GPT-2 text branches, ResNet-50 visual features, and MLP fusion."
    project_adaptation_component: "Project metadata + precomputed text/image embeddings with an sklearn MLP fusion head; this omits the paper's separate character-description and character-portrait branches."
    claim_allowed: "Loose anime-domain multimodal MLP adaptation inspired by Armenta-Segura & Sidorov 2025."
    claim_not_allowed: "Do not claim exact framework reproduction, numerical comparability, or matching paper inputs; the paper uses synopsis, character descriptions, and character portraits, not this project's metadata plus cover/banner embeddings."

  - id: C1-Armenta-ProxyBranchMLP
    enabled: false
    feature_set: metadata_text_image
    model: branch_mlp
    params:
      metadata_dim: 151
      text_dim: 384
      image_dim: 1024
      branch_dim: 128
      fusion_hidden_dims: [256, 128, 64]
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 100
      patience: 12
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Armenta-Segura & Sidorov 2025
    reproduction_level: adapted
    paper_supported_component: "Armenta-Segura & Sidorov 2025 supports branch-wise GPT-2 text features, ResNet-50 visual features, and MLP fusion for anime-domain prediction."
    project_adaptation_component: "Project metadata proxy, text embeddings, and image embeddings are processed by separate MLP branches before fusion; character descriptions and character portraits are not available in the current artifact set."
    claim_allowed: "Branch-wise multimodal MLP adaptation that is closer to the Armenta fusion pattern than the flat C1-Armenta-MLP baseline."
    claim_not_allowed: "Do not claim exact framework reproduction; this proxy branch model still lacks the paper's main-character description and portrait inputs and uses project cover/banner embeddings."

  - id: C1-Armenta-ProjectInputProxy
    enabled: false
    feature_set: metadata_text_image
    model: armenta_project_input_mlp
    params:
      metadata_dim: 151
      text_dim: 384
      image_dim: 1024
      branch_dim: 768
      big_mlp_hidden_dims: [768, 384, 192, 96, 48, 24, 12, 6]
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 100
      patience: 12
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Armenta-Segura & Sidorov 2025
    reproduction_level: adapted
    paper_supported_component: "Armenta-Segura & Sidorov 2025 supports a synopsis branch, a context branch compressed by an MLP, and a large MLP for final anime-domain prediction."
    project_adaptation_component: "Project synopsis/text embeddings form the synopsis branch; project cover/banner image embeddings plus metadata form a project-context branch; both 768-dimensional branch outputs are concatenated and passed through an Armenta-shaped Big MLP."
    claim_allowed: "Project-input Armenta-style branch-and-Big-MLP proxy for comparing whether the paper's fusion shape helps under this project's input contract."
    claim_not_allowed: "Do not claim Figure 2 reproduction, GPT-2/ResNet-50 reproduction, or character-branch reproduction; this row uses project embeddings and metadata rather than the paper's character descriptions and portraits."

  - id: C1-Armenta-ProjectInputProxy-ResNet50
    enabled: false
    feature_set: metadata_text_resnet50_image
    model: armenta_project_input_mlp
    params:
      metadata_dim: 151
      text_dim: 384
      image_dim: 4098
      branch_dim: 768
      big_mlp_hidden_dims: [768, 384, 192, 96, 48, 24, 12, 6]
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 100
      patience: 12
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Armenta-Segura & Sidorov 2025
    reproduction_level: adapted
    paper_supported_component: "Armenta-Segura & Sidorov 2025 uses ResNet-50 visual features, a synopsis text branch, a context branch, and a large MLP for final anime-domain prediction."
    project_adaptation_component: "Project synopsis/text embeddings remain the synopsis branch; project cover/banner raw images are encoded with ImageNet-pretrained ResNet-50 avg-pool features, concatenated with availability masks, then fused with metadata in the context branch before the Armenta-shaped Big MLP."
    claim_allowed: "Project-input Armenta-style proxy with a ResNet-50 visual encoder, suitable for testing whether a visual branch closer to the paper improves under this project's input contract."
    claim_not_allowed: "Do not claim Figure 2 reproduction, GPT-2 reproduction, character-description reproduction, or numerical comparability; this still uses project synopsis/metadata and cover/banner images instead of main-character descriptions and portraits."

  - id: C1-Armenta-ProjectInputReconstruction
    enabled: false
    feature_set: metadata_gpt2_resnet50_image
    model: armenta_project_input_mlp
    params:
      metadata_dim: 151
      text_dim: 768
      image_dim: 4098
      branch_dim: 768
      big_mlp_hidden_dims: [768, 384, 192, 96, 48, 24, 12, 6]
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 100
      patience: 12
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Armenta-Segura & Sidorov 2025
    reproduction_level: structure_complete_project_input
    paper_supported_component: "Armenta-Segura & Sidorov 2025 uses GPT-2 synopsis features, ResNet-50 visual features, a context/character MLP stage, and a Big MLP with 768->384->192->96->48->24->12->6 hidden widths."
    project_adaptation_component: "This reconstruction keeps this project's metadata/synopsis/cover/banner input contract, rebuilds synopsis embeddings with GPT-2 hidden states, uses ImageNet ResNet-50 cover/banner features, and preserves the Armenta-shaped branch plus Big MLP topology."
    claim_allowed: "Structure-complete project-input reconstruction of the Armenta fusion route: GPT-2-style synopsis branch, ResNet-50 visual branch, project-context MLP, and Armenta Big MLP under the project's temporal split."
    claim_not_allowed: "Do not claim exact paper reproduction or numerical comparability; this still replaces main-character descriptions/portraits with project metadata and cover/banner images, and it uses this project's popularity/meanScore targets."

  - id: C1-Armenta-Figure2Reconstruction
    enabled: false
    feature_set: c1_figure2_character
    model: armenta_figure2_reconstruction
    params:
      synopsis_dim: 768
      character_text_dim: 768
      portrait_dim: 49
      branch_dim: 768
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 100
      patience: 12
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Armenta-Segura & Sidorov 2025
    reproduction_level: figure2_side_reconstruction
    paper_supported_component: "Armenta-Segura & Sidorov 2025 Figure 2 uses GPT-2 synopsis embeddings, GPT-2 main-character-description embeddings, ResNet-50 portrait features, a character MLP with Dropout->Linear(768+49,768)->Tanh->Dropout->Linear(768,768), and the Big MLP."
    project_adaptation_component: "This side reconstruction keeps the project temporal split and targets, uses raw AniList main-character descriptions and portrait URLs when available, and uses zero-filled character features for rows without character artifacts."
    claim_allowed: "Closest C1 Figure-2 side reconstruction under available AniList raw character artifacts; useful for checking the original character-centric architecture separately from the project cover/banner mainline."
    claim_not_allowed: "Do not use this as the main project-input comparison row and do not claim exact numerical comparability; raw character coverage is incomplete and the task target/split still differ from the paper."

  - id: C2-CTNN-Lite
    enabled: false
    feature_set: text_image
    model: cross_modal_transformer
    params:
      text_dim: 384
      image_dim: 1024
      d_model: 128
      nhead: 4
      num_layers: 2
      dim_feedforward: 256
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 80
      patience: 10
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Madongo, Tang & Hassan 2023
    reproduction_level: adapted
    paper_supported_component: "Madongo et al. 2023 supports poster/review cross-modal attention transformer fusion for entertainment outcome prediction."
    project_adaptation_component: "Project text and image embeddings are projected into two modality tokens and fused with a lightweight TransformerEncoder regression head; this omits the paper's full CTNN/recurrent-fusion design."
    claim_allowed: "Lightweight cross-modal transformer fusion baseline adapted from poster-text box-office prediction literature."
    claim_not_allowed: "Do not claim exact CTNN reproduction; this implementation uses precomputed project embeddings, a simplified two-token transformer fusion head, and anime regression targets."

  - id: C2-ProjectInputCrossAttention
    enabled: false
    feature_set: metadata_text_image
    model: project_input_cross_attention
    params:
      metadata_dim: 151
      text_dim: 384
      image_dim: 1024
      d_model: 128
      nhead: 4
      num_layers: 2
      dim_feedforward: 256
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 90
      patience: 10
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Madongo, Tang & Hassan 2023
    reproduction_level: adapted
    paper_supported_component: "Madongo et al. 2023 supports cross-modal attention transformer fusion with auxiliary metadata-related factors for box-office prediction."
    project_adaptation_component: "Project synopsis/text and cover/banner image embeddings are fused through explicit bidirectional text-image cross-attention blocks, then metadata conditions the final modality-gated fusion."
    claim_allowed: "Project-input CTNN-style cross-attention proxy that keeps this project's metadata/text/image input contract while moving closer to the paper's cross-modal attention motivation."
    claim_not_allowed: "Do not claim exact CTNN reproduction; this implementation uses anime project embeddings, metadata-conditioned gating, and regression targets instead of the paper's movie review/poster pipeline and box-office class setup."

  - id: C2-ProjectInputRecurrentFusion
    enabled: false
    feature_set: metadata_text_image
    model: project_input_recurrent_fusion
    params:
      metadata_dim: 151
      text_dim: 384
      image_dim: 1024
      d_model: 128
      nhead: 4
      num_layers: 2
      dim_feedforward: 256
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 90
      patience: 10
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Madongo, Tang & Hassan 2023
    reproduction_level: adapted
    paper_supported_component: "Madongo et al. 2023 describes cross-modal attention transformer fusion together with recurrent-style fusion and metadata-related factors."
    project_adaptation_component: "Project metadata/text/image embeddings are fused with bidirectional text-image cross-attention, then a GRU recurrent fusion step refines the text/image/metadata token sequence before regression."
    claim_allowed: "Project-input CTNN-style recurrent fusion proxy that keeps this project's input contract while covering the paper's recurrent-fusion motivation."
    claim_not_allowed: "Do not claim exact CTNN reproduction; this row keeps anime embeddings and regression targets and does not use the paper's movie review/poster feature extraction or box-office class setup."

  - id: C2-ProjectInputCTNNReconstruction
    enabled: false
    feature_set: metadata_gpt2_resnet50_image
    model: project_input_ctnn_reconstruction
    params:
      metadata_dim: 151
      text_dim: 768
      image_dim: 4098
      d_model: 128
      nhead: 4
      num_layers: 2
      dim_feedforward: 256
      dropout: 0.1
      text_tokens: 4
      image_feature_dim: 2048
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 100
      patience: 12
      validation_fraction: 0.15
      random_state: 42
      device: cpu
      torch_num_threads: 1
      verbose: false
    reference: Madongo, Tang & Hassan 2023
    reproduction_level: structure_complete_project_input
    paper_supported_component: "Madongo et al. 2023 CTNN combines text/poster transformer encoders, cross-modal attention transformer fusion, recurrent fusion, and metadata-related factors for box-office prediction."
    project_adaptation_component: "This reconstruction keeps project synopsis/cover/banner/metadata inputs, uses GPT-2 synopsis embeddings and ResNet-50 cover/banner features, restores separate modality transformer encoders, bidirectional text-image cross-attention, GRU recurrent fusion, and metadata factor gating."
    claim_allowed: "Structure-complete project-input reconstruction of the CTNN route under anime inputs: transformer modality encoders, cross-modal attention, recurrent fusion, and metadata factor conditioning."
    claim_not_allowed: "Do not claim exact CTNN reproduction or numerical comparability; this does not use movie reviews, movie posters, box-office classes, or the original dataset."

  - id: C2-ProjectInputCTNNDualVisualReconstruction
    enabled: false
    feature_set: metadata_gpt2_dual_visual_image
