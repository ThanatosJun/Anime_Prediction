# ── Data ──────────────────────────────────────────────────────────────────────
data:
  csv_path: data/processed/anilist_anime_multimodal_input_v1.csv
  image_columns:
    - coverImage_medium
    - bannerImage
  image_size: 224             # resize 目標尺寸（swin-base 標準輸入）
  image_dir: data/image
  split_csv:
    train: data/processed/anilist_anime_multimodal_input_train.csv
    val:   data/processed/anilist_anime_multimodal_input_val.csv
    test:  data/processed/anilist_anime_multimodal_input_test.csv

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  name: microsoft/swin-base-patch4-window7-224
  pretrained: true
  stage: false          # output.py / ImageEmbedder 用（image_rag 路徑），true → 各 stage 分開存 _s0~s3
                        #（注意：Fusion 的 stage 投影設定在 fussion_configs.yaml 的 image_stage_projection）
  # run_swin_embedding.py（Fusion image 生成）的 embed 模式：
  #   pooler → 每模態 1024（pooler_output）
  #   stage  → 每模態 1920（4 個 stage concat：128+256+512+1024）
  # 切換為 stage 後須同步：fussion_configs.yaml 的 model.image_dim 改 1920，並重跑 Step 3 + 6/7
  fusion_embed_mode: pooler

# ── Training (ImageEmbedder 讀取 device / batch_size) ─────────────────────────
training:
  batch_size: 64
  device: cuda                # cuda / cpu

# ── Inference (output.py main()) ──────────────────────────────────────────────
inference:
  model_path: src_2/component_image/model-image/best   # 含 config.json + model.safetensors
  embedding_path: data/processed/image_embeddings.parquet
  file_kind: file  # file(csv 批次) | image(單張圖)
  use_yolo: true   # 覆蓋下方 yolo_detection.use 設定

# ── YOLO Detection ────────────────────────────────────────────────────────────
yolo_detection:
  detect_mode: both              # person | face | both
  yolo:
    use: true

  model:                         # person 偵測模型
    repo_id: deepghs/anime_person_detection
    level: m                     # n（最快）/ s / m / x（最準）
    version: v1.1

  detection:                     # person 偵測參數
    conf_threshold: 0.2
    iou_threshold: 0.8
    max_detections: 5
    min_bbox_ratio: 0.05
    save_crops: true
    fallback_full_image: true

  face_model:                    # face 偵測模型
    repo_id: deepghs/anime_face_detection
    level: s
    version: v1.4

  face_detection:                # face 偵測參數
    conf_threshold: 0.15
    iou_threshold: 0.9
    max_detections: 5
    min_bbox_ratio: 0.02
    save_crops: true
    fallback_full_image: true
