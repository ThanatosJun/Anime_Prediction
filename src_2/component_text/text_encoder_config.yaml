# ── Model ─────────────────────────────────────────────────────────────────────
model:
  model_name: intfloat/e5-base-v2   # 768-dim，Text branch 實驗最佳基線
  device: auto                       # auto | cuda | cpu
  batch_size: 16

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  lowercase: true
  remove_urls: true
  remove_marketing: false    # Exp 01 結論：保留原始訊號效果更佳
  remove_extra_whitespace: true
  min_length: 10
  max_length: 512

# ── Inference（output.py main() 批次模式）────────────────────────────────────
inference:
  text_column: description
  id_column: id
  # input_csv 依 split 切換：
  input_csv:   src_2/data/dataset/fusion_meta_clean_train_v2.csv
  output_path: src_2/data/text_embeddings/text_embeddings_train.parquet
