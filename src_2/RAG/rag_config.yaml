qdrant:
  collection_name: "anime_rag_v2"
  host: "localhost"
  port: 6333

paths:
  meta_dir:      "src_2/data/dataset"
  meta_suffix:   "_v2"
  encoder_path:  "src_2/RAG/sparse_encoder.json"
  text_emb_dir:  "src_2/embedding/text"
  image_emb_dir: "src_2/embedding/image_rag"
  out_dir:       "src_2/RAG/return"

embedding:
  text_emb_dim:  768      # e5-base-v2（舊：384 MiniLM）
  image_emb_dim: 1024     # Swin-B（不變）

indexing:
  batch_size: 256

query:
  top_k:      1    # top-1 payload → RAG scalar metadata features
  top_k_ids:  5    # top-5 IDs → Cross Attention（舊：GNN）
  prefetch_k: 50
